name: Unit tests
on:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Compile sources
      run: python3 -m compileall -q src tests
    - name: Run unit tests
      run: python3 -m unittest discover -v tests
